<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Smart and Safe: a second-hand phone marketplace that checks IMEI numbers against a stolen-phone registry">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#1d3b8a"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .ring { transform-origin: 960px 140px; animation: pulse 2.6s ease-out infinite; }
      .ring.r2 { animation-delay: 1.3s; }
      @keyframes pulse { 0% { transform: scale(0.6); opacity: 0.7; } 100% { transform: scale(1.6); opacity: 0; } }
      .tick { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw 2.6s ease-in-out infinite; }
      @keyframes draw { 0%, 20% { stroke-dashoffset: 60; } 50%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 60; } }
    </style>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>

  <text x="64" y="118" font-size="64" font-weight="800" fill="#ffffff">Smart<tspan fill="#fbbf24">&amp;</tspan>Safe</text>
  <text x="66" y="162" font-size="24" fill="#cbd5e1">A second-hand phone marketplace that checks</text>
  <text x="66" y="194" font-size="24" fill="#cbd5e1">every listing against a stolen-IMEI registry.</text>
  <g font-size="15" font-weight="600">
    <rect x="66" y="218" width="64" height="28" rx="14" fill="#2563eb"/><text x="98" y="237" text-anchor="middle" fill="#fff">Buy</text>
    <rect x="140" y="218" width="64" height="28" rx="14" fill="#2563eb"/><text x="172" y="237" text-anchor="middle" fill="#fff">Sell</text>
    <rect x="214" y="218" width="150" height="28" rx="14" fill="#b91c1c"/><text x="289" y="237" text-anchor="middle" fill="#fff">Report stolen</text>
    <rect x="374" y="218" width="126" height="28" rx="14" fill="#15803d"/><text x="437" y="237" text-anchor="middle" fill="#fff">Verify IMEI</text>
  </g>

  <circle class="ring" cx="960" cy="140" r="90" fill="none" stroke="#60a5fa" stroke-width="3"/>
  <circle class="ring r2" cx="960" cy="140" r="90" fill="none" stroke="#60a5fa" stroke-width="3"/>
  <rect x="910" y="50" width="100" height="180" rx="16" fill="#0f172a" stroke="#93c5fd" stroke-width="4"/>
  <rect x="922" y="68" width="76" height="132" rx="6" fill="#1e293b"/>
  <circle cx="960" cy="215" r="6" fill="#93c5fd"/>
  <path d="M960 92 l26 10 v22 c0 18 -12 30 -26 36 c-14 -6 -26 -18 -26 -36 v-22 z" fill="#15803d"/>
  <path class="tick" d="M948 126 l9 9 l17 -19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
